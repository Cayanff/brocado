<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15110d">
<title>SERTÃO GRILL — Hamburgueria</title>
<meta name="description" content="Cardápio online da SERTÃO GRILL. Peça pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TROQUE (opcional): foto de capa em images/capa.jpg e logo em images/logo.png -->
<section class="store">
  <div class="cover">
    <div class="status-box" id="statusBox"><span class="dot"></span><b id="statusTxt">…</b><small id="statusSub"></small></div>
    <div class="cover-actions">
      <a class="icon-btn" id="btnInsta" target="_blank" rel="noopener" aria-label="Instagram">IG</a>
      <a class="icon-btn wa" id="btnWa" target="_blank" rel="noopener" aria-label="WhatsApp">WA</a>
    </div>
    <div class="logo-box"><img src="images/logo.png" alt="Logo SERTÃO GRILL" onerror="this.onerror=null;this.src='icon.svg'"></div>
  </div>
  <div class="store-info">
    <h1 class="store-name" id="storeName">SERTÃO GRILL</h1>
    <div class="store-meta" id="storeMeta"></div>
    <button class="info-btn" id="btnInfo" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
      Informações
    </button>
  </div>
</section>

<div class="tabbar">
  <div class="tabbar-in">
    <button class="sq" id="btnBusca" type="button" aria-label="Buscar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
    </button>
    <button class="sq" id="btnMenu" type="button" aria-label="Categorias">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="cats" id="cats"></nav>
  </div>
  <div class="searchrow" id="buscaRow" hidden>
    <input id="busca" type="search" placeholder="Buscar no cardápio" aria-label="Buscar produtos">
  </div>
</div>

<main id="cardapio">
  <div id="lista"></div>
</main>

<footer class="foot">© SERTÃO GRILL · Peça direto, sem intermediário.</footer>

<a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">WA</a>
<button class="cart-bar" id="cartBar" hidden><span id="cartQtd">0</span> Ver carrinho <b id="cartTotalBar"></b></button>

<div class="toast" id="toast" role="status"></div>

<!-- Informações da loja -->
<div class="sheet-wrap" id="infoWrap" hidden>
  <div class="sheet" role="dialog" aria-label="Informações">
    <div class="sheet-head"><h2>Informações</h2><button class="x" data-close aria-label="Fechar">✕</button></div>
    <div class="info" id="infoBody"></div>
  </div>
</div>

<!-- Categorias -->
<div class="sheet-wrap" id="catWrap" hidden>
  <div class="sheet" role="dialog" aria-label="Categorias">
    <div class="sheet-head"><h2>Categorias</h2><button class="x" data-close aria-label="Fechar">✕</button></div>
    <div id="catLista"></div>
  </div>
</div>

<!-- Adicionais -->
<div class="sheet-wrap" id="extraWrap" hidden>
  <div class="sheet" role="dialog" aria-label="Adicionais">
    <div class="sheet-head"><h2 id="extraTitulo">Adicionais</h2><button class="x" data-close aria-label="Fechar">✕</button></div>
    <div id="extraLista"></div>
    <button class="cta full" id="extraOk">Adicionar ao carrinho</button>
  </div>
</div>

<!-- Carrinho -->
<div class="sheet-wrap" id="cartWrap" hidden>
  <div class="sheet tall" role="dialog" aria-label="Carrinho">
    <div class="sheet-head"><h2>Seu pedido</h2><button class="x" data-close aria-label="Fechar">✕</button></div>
    <div id="itens"></div>

    <div class="seg" id="tipoSeg">
      <label><input type="radio" name="tipo" value="entrega" checked><span>Entrega</span></label>
      <label><input type="radio" name="tipo" value="retirada"><span>Retirada</span></label>
    </div>

    <div id="blocoEntrega">
      <label class="f">Bairro<select id="bairro"></select></label>
      <label class="f">Endereço (rua, número, referência)<textarea id="endereco" rows="2"></textarea></label>
    </div>

    <label class="f">Nome<input id="nome" type="text" autocomplete="name"></label>
    <label class="f">Seu WhatsApp (com DDD)<input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="99 99999-9999"></label>
    <label class="f">Pagamento
      <select id="pagto"><option value="">Selecione</option></select>
    </label>
    <label class="f" id="blocoTroco" hidden>Troco para quanto?<input id="troco" type="text" inputmode="decimal"></label>
    <label class="f">Observações<textarea id="obs" rows="2" placeholder="Ex.: sem cebola, ponto da carne…"></textarea></label>

    <div class="cupom">
      <input id="cupom" type="text" placeholder="Cupom" autocapitalize="characters">
      <button id="cupomBtn" type="button">Aplicar</button>
    </div>

    <dl class="resumo">
      <div><dt>Subtotal</dt><dd id="rSub"></dd></div>
      <div id="rDescL"><dt>Desconto</dt><dd id="rDesc"></dd></div>
      <div><dt>Entrega</dt><dd id="rEnt"></dd></div>
      <div class="tot"><dt>Total</dt><dd id="rTot"></dd></div>
    </dl>
    <p class="erro" id="erro"></p>
    <button class="cta full" id="finalizar">FINALIZAR PEDIDO</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
