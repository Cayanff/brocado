<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2fa3">
<title>SERTÃO GRILL — Hamburgueria</title>
<meta name="description" content="Cardápio online da SERTÃO GRILL. Peça pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="logo" href="#">SERTÃO GRILL</a>
  <span class="status" id="status">…</span>
  <a class="icon-btn" id="btnInsta" target="_blank" rel="noopener" aria-label="Instagram">IG</a>
  <a class="icon-btn wa" id="btnWa" target="_blank" rel="noopener" aria-label="WhatsApp">WA</a>
</header>

<section class="hero">
  <div class="hero-txt">
    <h1>Hambúrguer com sotaque.</h1>
    <p>Feito na hora, do jeito que o Nordeste gosta: com sustança.</p>
    <a class="cta" href="#cardapio">PEDIR AGORA</a>
  </div>
  <!-- TROQUE: imagem do banner (coloque sua foto em images/banner.jpg) -->
  <img class="hero-img" src="images/banner.jpg" alt="Hambúrguer SERTÃO GRILL" onerror="this.onerror=null;this.src=XILO('hamb',1);this.style.objectFit='contain'">
</section>

<main id="cardapio">
  <div class="tools">
    <input id="busca" type="search" placeholder="Buscar no cardápio" aria-label="Buscar produtos">
    <nav class="cats" id="cats"></nav>
  </div>
  <div id="lista"></div>
</main>

<footer class="foot"><div class="hrs" id="horarios"></div>© SERTÃO GRILL · Peça direto, sem intermediário.</footer>

<a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">WA</a>
<button class="cart-bar" id="cartBar" hidden><span id="cartQtd">0</span> Ver carrinho <b id="cartTotalBar"></b></button>

<div class="toast" id="toast" role="status"></div>

<!-- Adicionais -->
<div class="sheet-wrap" id="extraWrap" hidden>
  <div class="sheet" role="dialog" aria-label="Adicionais">
    <div class="sheet-head"><h2 id="extraTitulo">Adicionais</h2><button class="x" data-close aria-label="Fechar">✕</button></div>
    <div id="extraLista"></div>
    <button class="cta full" id="extraOk">Adicionar ao carrinho</button>
  </div>
</div>

<!-- Carrinho -->
<div class="sheet-wrap" id="cartWrap" hidden>
  <div class="sheet tall" role="dialog" aria-label="Carrinho">
    <div class="sheet-head"><h2>Seu pedido</h2><button class="x" data-close aria-label="Fechar">✕</button></div>
    <div id="itens"></div>

    <div class="seg" id="tipoSeg">
      <label><input type="radio" name="tipo" value="entrega" checked><span>Entrega</span></label>
      <label><input type="radio" name="tipo" value="retirada"><span>Retirada</span></label>
    </div>

    <div id="blocoEntrega">
      <label class="f">Bairro<select id="bairro"></select></label>
      <label class="f">Endereço (rua, número, referência)<textarea id="endereco" rows="2"></textarea></label>
    </div>

    <label class="f">Nome<input id="nome" type="text" autocomplete="name"></label>
    <label class="f">Seu WhatsApp (com DDD)<input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="99 99999-9999"></label>
    <label class="f">Pagamento
      <select id="pagto"><option value="">Selecione</option></select>
    </label>
    <label class="f" id="blocoTroco" hidden>Troco para quanto?<input id="troco" type="text" inputmode="decimal"></label>
    <label class="f">Observações<textarea id="obs" rows="2" placeholder="Ex.: sem cebola, ponto da carne…"></textarea></label>

    <div class="cupom">
      <input id="cupom" type="text" placeholder="Cupom" autocapitalize="characters">
      <button id="cupomBtn" type="button">Aplicar</button>
    </div>

    <dl class="resumo">
      <div><dt>Subtotal</dt><dd id="rSub"></dd></div>
      <div id="rDescL"><dt>Desconto</dt><dd id="rDesc"></dd></div>
      <div><dt>Entrega</dt><dd id="rEnt"></dd></div>
      <div class="tot"><dt>Total</dt><dd id="rTot"></dd></div>
    </dl>
    <p class="erro" id="erro"></p>
    <button class="cta full" id="finalizar">FINALIZAR PEDIDO</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
