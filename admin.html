<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>SERTÃO GRILL — Painel</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#f1e6c4;color:#15110d;padding-bottom:40px}
[hidden]{display:none!important}
header{position:sticky;top:0;background:#15110d;color:#f1e6c4;padding:12px 14px;display:flex;gap:10px;align-items:center;border-bottom:4px solid #e2402a;z-index:5}
header b{font:1.2rem Georgia,serif;letter-spacing:.06em;margin-right:auto}
button,input{font:inherit}
.b{border:2.5px solid #15110d;background:#fffaf0;border-radius:2px;padding:12px 14px;font-weight:700;cursor:pointer}
.b.p{background:#e2402a;color:#fff;box-shadow:3px 3px 0 #15110d}.b.k{background:#15110d;color:#f1e6c4}
.tabs{display:flex;gap:8px;padding:12px 14px}.tabs .on{background:#e2402a;color:#fff}
.tot{padding:0 14px 8px;font-weight:700}
.login{padding:20px 14px;display:grid;gap:10px;max-width:480px;margin:auto}
.login input{padding:14px;border:2.5px solid #15110d;background:#fffaf0}
.card{margin:12px 14px;background:#fffaf0;border:3px solid #15110d;box-shadow:5px 5px 0 #15110d;padding:14px;max-width:640px}
@media(min-width:700px){.card{margin-left:auto;margin-right:auto}}
.card h3{display:flex;justify-content:space-between;font-family:Georgia,serif}
.st{display:inline-block;padding:3px 9px;background:#15110d;color:#f1e6c4;font-size:.8rem;margin:6px 0}
.st.Novo{background:#e2402a}.st.Entregue{background:#1f7a45}.st.Cancelado{background:#777}
pre{white-space:pre-wrap;font:inherit;margin:8px 0;padding:8px;border:2px dashed #15110d}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.acts .b{flex:1;min-width:120px}
.etapas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.etapas .e{flex:1;min-width:72px;border:2px solid #15110d;background:#fffaf0;border-radius:2px;padding:8px 4px;font-size:.72rem;font-weight:700;cursor:pointer}
.etapas .e.on{background:#15110d;color:#f1e6c4;cursor:default}
.etapas .e:disabled{opacity:1}
.erro{color:#c62828;font-weight:700}
</style></head><body>
<header><b>SERTÃO GRILL · PEDIDOS</b><button class="b" id="sair" hidden>Sair</button></header>
<div class="login" id="login">
  <input id="url" placeholder="Link do painel (Apps Script)" autocapitalize="off">
  <input id="key" type="password" placeholder="Senha do painel">
  <p class="erro" id="err"></p>
  <button class="b p" id="entrar">ENTRAR</button>
</div>
<div id="app" hidden>
  <div class="tabs"><button class="b on" data-t="a">Ativos</button><button class="b" data-t="t">Todos</button><button class="b k" id="ref">↻</button></div>
  <div class="tot" id="tot"></div><div id="lista"></div>
</div>
<script>
/* Preencha aqui para o painel abrir direto, sem tela de login (recomendado).
   Deixe "" nos dois para continuar pedindo link e senha toda vez. */
const PAINEL_URL = "https://script.google.com/macros/s/AKfycbyQbfDo8D5U0Spcf4xH9Fbf4jJIR-ZqNDQrTTbWHDJucp5xLiycK4UQcntcOOH0WuJZQA/exec";   // ← cole aqui o link do Apps Script, entre as aspas
const PAINEL_SENHA = "cayan244."; // ← cole aqui a senha do painel, entre as aspas

const $=s=>document.querySelector(s),brl=v=>"R$ "+Number(v||0).toFixed(2).replace(".",",");
let cfg=(PAINEL_URL&&PAINEL_SENHA)?{url:PAINEL_URL,key:PAINEL_SENHA}:JSON.parse(localStorage.getItem("bro_admin")||"null"),tab="a",dados=[],ult=null,ctx;
const ETAPAS=["Novo","Em preparo","Saiu para entrega","Entregue"];
const MSG={"Em preparo":"já estamos preparando seu pedido 🍔","Saiu para entrega":"seu pedido saiu para entrega 🛵","Entregue":"pedido entregue. Obrigado e bom apetite! 🙌","Cancelado":"infelizmente precisamos cancelar seu pedido. Vamos conversar por aqui.","Novo":"recebemos seu pedido ✅"};
function beep(){try{ctx=ctx||new AudioContext();[0,.25,.5].forEach(t=>{const o=ctx.createOscillator();o.connect(ctx.destination);o.frequency.value=880;o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.15)})}catch(e){}}
async function api(q){const r=await fetch(cfg.url+"?key="+encodeURIComponent(cfg.key)+q);return r.json()}
async function carregar(){
  try{const j=await api("");
    if(!j.ok){$("#err").textContent="Senha incorreta ou link inválido.";return sair()}
    dados=j.pedidos;const m=Math.max(0,...dados.map(p=>p.n));
    if(ult!==null&&m>ult)beep();ult=m;render();
  }catch(e){$("#err").textContent="Não consegui conectar. Confira o link.";}
}
function render(){
  const hoje=new Date().toDateString(),dia=dados.filter(p=>new Date(p.data).toDateString()===hoje&&p.status!=="Cancelado");
  $("#tot").textContent=`Hoje: ${dia.length} pedidos · ${brl(dia.reduce((s,p)=>s+Number(p.total),0))}`;
  const l=dados.filter(p=>tab==="t"||!["Entregue","Cancelado"].includes(p.status));
  $("#lista").innerHTML=l.map(p=>`<div class="card"><h3><span>#${p.n} ${p.nome}</span><span>${brl(p.total)}</span></h3>
    <span class="st ${p.status}">${p.status}</span> <small>${new Date(p.data).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} · ${p.tipo}</small>
    <pre>${p.itens}</pre><div>💳 ${p.pag}${p.end?`<br>📍 ${p.end}`:""}${p.obs?`<br>📝 ${p.obs}`:""}</div>
    <div class="etapas">${ETAPAS.map(e=>`<button class="e ${e===p.status?"on":""}" data-id="${p.n}" data-s="${e}" ${e===p.status?"disabled":""}>${e}</button>`).join("")}</div>
    <div class="acts"><button class="b" data-wa="${p.n}">💬 Avisar cliente</button>
    ${["Entregue","Cancelado"].includes(p.status)?"":`<button class="b" data-id="${p.n}" data-s="Cancelado">Cancelar</button>`}</div></div>`).join("")||'<p style="padding:20px">Nenhum pedido por aqui.</p>';
}
$("#lista").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.wa){const p=dados.find(x=>x.n==b.dataset.wa);let t=p.tel.replace(/\D/g,"");if(t.length<=11)t="55"+t;
    open(`https://wa.me/${t}?text=`+encodeURIComponent(`Olá, ${p.nome}! Pedido #${p.n} SERTÃO GRILL: ${MSG[p.status]}`),"_blank");return}
  const p=dados.find(x=>x.n==b.dataset.id);if(p)p.status=b.dataset.s;render();
  api(`&acao=status&id=${b.dataset.id}&status=${encodeURIComponent(b.dataset.s)}`);
});
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#ref").onclick=carregar;
function entrar(){$("#login").hidden=true;$("#app").hidden=false;$("#sair").hidden=false;carregar();setInterval(carregar,15000)}
function sair(){localStorage.removeItem("bro_admin");location.reload()}
$("#sair").onclick=sair;
$("#entrar").onclick=()=>{cfg={url:$("#url").value.trim(),key:$("#key").value};localStorage.setItem("bro_admin",JSON.stringify(cfg));ctx=new AudioContext();entrar()};
if(cfg)entrar();
</script></body></html>
